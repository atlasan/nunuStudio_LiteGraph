<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>nunuStudio runtime harness</title>
	<style>html, body {margin: 0; background: #000;} canvas {display: block;}</style>
</head>
<body>
	<!-- Usage: runtime.html?project=/examples/name.nsp[&runtime=/cache/master/nunu.min.js] -->
	<canvas id="canvas" width="480" height="270"></canvas>
	<script>
		var params = new URLSearchParams(location.search);
		var script = document.createElement("script");
		script.src = params.get("runtime") || "/files/runtime/nunu.min.js";
		script.onload = function()
		{
			var canvas = document.getElementById("canvas");
			canvas.addEventListener("webglcontextlost", function()
			{
				console.error("WebGL context lost");
			});

			// Scripts get their own seeded random stream (their Math object), independent of how many random numbers the
			// engine draws (e.g. for UUIDs), which differs between versions
			if (window.seededRandom !== undefined)
			{
				var scriptRandom = window.seededRandom(2);
				var createContext = Nunu.Script.prototype.createContextObject;
				Nunu.Script.prototype.createContextObject = function()
				{
					var context = createContext.apply(this, arguments);
					context.Math.random = scriptRandom;
					return context;
				};
			}

			var app = new Nunu.App(canvas);
			app.loadProgramAsync(params.get("project"), function()
			{
				app.run();
				window.app = app;
				window.loaded = true;
			}, function() {});
		};
		document.body.appendChild(script);
	</script>
</body>
</html>
